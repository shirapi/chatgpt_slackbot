AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  slackbot
  SAM Template for slackbot

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Handler: app.lambda_handler
    Runtime: python3.10
    CodeUri: workspace/
    MemorySize: 128
    Timeout: 180
    Environment:
      Variables:
        SLACK_API_SIGNING_SECRET: !Ref SigningSecret
        SLACK_BOT_OAUTH_TOKEN: !Ref OAuthToken
        OPENAI_API_KEY: !Ref ApiKey
        SLACK_CHANNEL_ID: !Ref ChannelId
        # SLACK_API_SIGNING_SECRET: "{{resolve:secretsmanager:HiyokoSecret:SecretString:SigningSecret}}"
        # SLACK_BOT_OAUTH_TOKEN: "{{resolve:secretsmanager:HiyokoSecret:SecretString:OAuthToken}}"
        # OPENAI_API_KEY: "{{resolve:secretsmanager:HiyokoSecret:SecretString:ApiKey}}"
        # SLACK_CHANNEL_ID: "{{resolve:secretsmanager:HiyokoSecret:SecretString:ChannelId}}"
    Tracing: Active
    Architectures:
      - x86_64
    Layers:
      - !Ref HiyokoLayer
  # Api:
  #   TracingEnabled: true

Parameters:
  SigningSecret:
    Type: String
    NoEcho: true
  OAuthToken:
    Type: String
    NoEcho: true
  ApiKey:
    Type: String
    NoEcho: true
  ChannelId:
    Type: String
    NoEcho: true

Resources:
  # SlackbotAPI:
  #   Type: AWS::Serverless::Api
  #   Properties:
  #     Name: slackbot-api
  #     StageName: Prod
  #     EndpointConfiguration:
  #       Type: Region
  #     Auth:
  #       ApiKeyRequired: false
  HiyokoFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      FunctionName: slackbot-HiyokoFunction
      # Events:
      #   CatchAll:
      #     Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
      #     Properties:
      #       Path: /hello
      #       Method: get
      #       # RestApiId: !Ref SlackbotAPI
      FunctionUrlConfig:
        AuthType: NONE
  HiyokoLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: for HiyokoFunction
      ContentUri: 'layer/'
      CompatibleRuntimes:
        - python3.10
    Metadata:
      BuildMethod: python3.10
  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Sub 'ApplicationInsights-SAM-${AWS::StackName}'
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      AutoConfigurationEnabled: true
      ResourceGroupName: !Ref ApplicationResourceGroup
  # HiyokoSecret:
  #   Type: AWS::SecretsManager::Secret
  #   Properties:
  #     Name: HiyokoSecret
  #     Description: hiyoko-secret
  #     SecretString: !Sub '{"SigningSecret":"${SigningSecret}","OAuthToken":"${OAuthToken}","ApiKey":"${ApiKey}","ChannelId":"${ChannelId}"}'
  #     Tags:
  #       - Key: Name
  #         Value: !Sub hiyoko-secret
  #   UpdateReplacePolicy: Delete
  #   DeletionPolicy: Delete
Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  # HiyokoApi:
  #   Description: "API Gateway endpoint URL for Prod stage for Hiyoko function"
  #   Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/hello/"
  # HiyokoFunction:
  #   Description: Hiyoko Lambda Function ARN
  #   Value: !GetAtt HiyokoFunction.Arn
  # HiyokoFunctionIamRole:
  #   Description: Implicit IAM Role created for Hiyoko function
  #   Value: !GetAtt HiyokoFunctionRole.Arn
  HiyokoFunctionUrl:
    Description: "Function URLs endpoint"
    Value: !GetAtt HiyokoFunctionUrl.FunctionUrl
