version: 0.2

env:
  parameter-store:
    API_KEY: /slackbot/ApiKey
    SIGNING_SECRET: /slackbot/SigningSecret
    OAUTH_TOKEN: /slackbot/OAuthToken
    CHANNEL_ID: /slackbot/ChannelId

phases:
  install:
    runtime-versions:
        python: 3.8
  pre_build:
    commands:
      - echo "Pre-build phase"
  build:
    commands:
      - echo "Build phase"
      - ApiKey=$(aws ssm get-parameters --region ap-northeast-1 --names $API_KEY --query 'Parameters[0].Value' --output text)
      - SigningSecret=$(aws ssm get-parameters --region ap-northeast-1 --names $SIGNING_SECRET --query 'Parameters[0].Value' --output text)
      - OAuthToken=$(aws ssm get-parameters --region ap-northeast-1 --names $OAUTH_TOKEN --query 'Parameters[0].Value' --output text)
      - ChannelId=$(aws ssm get-parameters --region ap-northeast-1 --names $CHANNEL_ID --query 'Parameters[0].Value' --output text)
      - echo "channelID $ChannelID"
      - sam build
      - sam deploy --stack-name slackbot --region ap-northeast-1 --parameter-overrides SigningSecret=${SigningSecret} OAuthToken=${OAuthToken} ApiKey=${ApiKey} ChannelId=${ChannelId}
