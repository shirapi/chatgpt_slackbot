version: 0.2

env:
  parameter-store:
    API_KEY: /slackbot/ApiKey
    SIGNING_SECRET: /slackbot/SigningSecret
    OAUTH_TOKEN: /slackbot/OAuthToken
    CHANNEL_ID: /slackbot/ChannelId

phases:
  install:
    runtime-versions:
        python: 3.8
  pre_build:
    commands:
      - echo "Pre-build phase"
      - ApiKey2=$(aws ssm get-parameters --region ap-northeast-1 --names $API_KEY --query 'Parameters[0].Value' --output text)
      - SigningSecret2=$(aws ssm get-parameters --region ap-northeast-1 --names $SIGNING_SECRET --query 'Parameters[0].Value' --output text)
      - OAuthToken2=$(aws ssm get-parameters --region ap-northeast-1 --names $OAUTH_TOKEN --query 'Parameters[0].Value' --output text)
      - ChannelId2=$(aws ssm get-parameters --region ap-northeast-1 --names $CHANNEL_ID --query 'Parameters[0].Value' --output text)
  build:
    commands:
      - echo "Build phase"
      - sam build
  post_build:
    commands:
  #     - echo "Post-build phase"
      # - sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
      # - sam deploy --template-file template.yaml --stack-name slackbot --capabilities CAPABILITY_IAM
      # - sam deploy --template-file template.yaml --stack-name slackbot --capabilities CAPABILITY_IAM --no-confirm-changeset --no-fail-on-empty-changeset
      - sam deploy --stack-name slackbot --region ap-northeast-1 --parameter-overrides SigningSecret=${SigningSecret2} OAuthToken=${OAuthToken2} ApiKey=${ApiKey2} ChannelId=${ChannelId2}

