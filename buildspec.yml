version: 0.2

env:
  parameter-store:
    API_KEY: /slackbot/ApiKey
    SIGNING_SECRET: /slackbot/SigningSecret
    OAUTH_TOKEN: /slackbot/OAuthToken
    CHANNEL_ID: /slackbot/ChannelId

phases:
  install:
    runtime-versions:
      python: 3.10
  pre_build:
    commands:
      - echo "Pre-build phase"
  build:
    commands:
      - echo "Build phase"
      - sam build
  # post_build:
  #   commands:
  #     - echo "Post-build phase"
      - sam deploy --stack-name slackbot --region ap-northeast-1 --parameter-overrides SigningSecret=${SIGNING_SECRET} OAuthToken=${OAUTH_TOKEN} ApiKey=${API_KEY} ChannelId=${CHANNEL_ID}  --no-confirm-changeset --no-fail-on-empty-changeset

# https://docs.aws.amazon.com/ja_jp/codebuild/latest/userguide/build-spec-ref.html
