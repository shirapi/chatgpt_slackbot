version: 0.2
phases:
  install:
    runtime-versions:
        python: 3.10
  build:
    commands:
      - sam package --template-file template.yml --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-skjjqchkinms --output-template-file packaged-template.yml
artifacts:
  files:
    - packaged-template.yml
