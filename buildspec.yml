version: 0.2

env:
  parameter-store:
    API_KEY: /slackbot/ApiKey2
    SIGNING_SECRET: /slackbot/SigningSecret
    OAUTH_TOKEN: /slackbot/OAuthToken
    CHANNEL_ID: /slackbot/ChannelId

phases:
  install:
    runtime-versions:
        python: 3.8
  pre_build:
    commands:
      - echo "Pre-build phase"
  build:
    commands:
      - echo "Build phase"
      - ApiKey2=$(aws ssm get-parameters --region ap-northeast-1 --names $API_KEY2 --query 'Parameters[0].Value' --output text)
      - SigningSecret2=$(aws ssm get-parameters --region ap-northeast-1 --names $SIGNING_SECRET --query 'Parameters[0].Value' --output text)
      - OAuthToken2=$(aws ssm get-parameters --region ap-northeast-1 --names $OAUTH_TOKEN --query 'Parameters[0].Value' --output text)
      - ChannelId2=$(aws ssm get-parameters --region ap-northeast-1 --names $CHANNEL_ID --query 'Parameters[0].Value' --output text)
      - sam build
      - sam deploy --stack-name slackbot --region ap-northeast-1 --parameter-overrides SigningSecret2=${SigningSecret2} OAuthToken=${OAuthToken2} ApiKey=${ApiKey2} ChannelId=${ChannelId2}

