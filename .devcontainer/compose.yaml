services:
  app:
    container_name: slackbot_app
    image: slackbot_app
    build:
      context: .
      dockerfile: Dockerfile
    tty: true
    volumes:
      - type: bind
        source: ../workspace
        target: /workspace
      - type: bind
        source: requirements.txt
        target: /workspace/layer/requirements.txt
    env_file:
      - ./.variables.env
